[package]
name = "axibiz"
version = "0.25.0"
edition = "2021"
description = "Axibiz Desktop Beta local business workspace for tasks, invoicing and expenses"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

chrono = "0.4"
chrono-tz = "0.10"
egui_extras = { version = "0.33.3", default-features = false, features = ["datepicker"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

rfd = { version = "0.15.4", default-features = false }

sha2 = "0.10"
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.5"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
